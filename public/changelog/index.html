<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Release Log</title>
<meta name="description" content="Browse the latest product updates, fixes, and release notes — searchable, versioned, and always up to date.">
<meta property="og:type" content="website">
<meta property="og:title" content="Release Log">
<meta property="og:description" content="Browse the latest product updates, fixes, and release notes — searchable, versioned, and always up to date.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Release Log">
<meta name="twitter:description" content="Browse the latest product updates, fixes, and release notes — searchable, versioned, and always up to date.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EEF1F4;
    --paper-raised: #FFFFFF;
    --paper-open: #F7F5EF;
    --ink: #1B2430;
    --ink-soft: #5B6672;
    --hairline: #C7CFD8;
    --spine: #ABB5C0;
    --stamp-added: #2F6F4E;
    --stamp-added-bg: #E4F0E9;
    --stamp-updated: #3D5A80;
    --stamp-updated-bg: #E5EAF2;
    --stamp-fixed: #6A4C93;
    --stamp-fixed-bg: #ECE6F3;
    --stamp-changed: #7A6A2E;
    --stamp-changed-bg: #F2EEDE;
    --stamp-removed: #942F32;
    --stamp-removed-bg: #F7DEDE;
    --stamp-security: #9C1F3C;
    --stamp-security-bg: #F8DCE3;
    --stamp-improved: #2A7F8C;
    --stamp-improved-bg: #E1EFF1;
    --stamp-deprecated: #8A5A2B;
    --stamp-deprecated-bg: #F1E7DA;
    --stamp-known: #A6641C;
    --stamp-known-bg: #F4E9D9;
    --stamp-default: #55606B;
    --stamp-default-bg: #E7EAEC;
    --amber: #C77D31;
    --green: #2F8F5B;
    --shadow: 0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05);
    --shadow-hover: 0 2px 4px rgba(27,36,48,0.08), 0 10px 26px rgba(27,36,48,0.08);
    --shadow-open: 0 3px 8px rgba(27,36,48,0.10), 0 16px 34px rgba(27,36,48,0.11);
    --radius: 10px;
    color-scheme: light;
  }

  html[data-theme="dark"]{
    --paper: #0F141B;
    --paper-raised: #161D26;
    --paper-open: #1B2130;
    --ink: #E7ECF1;
    --ink-soft: #93A0AC;
    --hairline: #2A3440;
    --spine: #3E4956;
    --stamp-added: #7FCBA0;
    --stamp-added-bg: #17261E;
    --stamp-updated: #8FB0DE;
    --stamp-updated-bg: #17222F;
    --stamp-fixed: #C4A9E8;
    --stamp-fixed-bg: #241C30;
    --stamp-changed: #D8C877;
    --stamp-changed-bg: #2A2717;
    --stamp-removed: #F0A3A5;
    --stamp-removed-bg: #34181A;
    --stamp-security: #F293AC;
    --stamp-security-bg: #34121C;
    --stamp-improved: #7FCBDA;
    --stamp-improved-bg: #142529;
    --stamp-deprecated: #D9AE7C;
    --stamp-deprecated-bg: #2A2015;
    --stamp-known: #E0B36E;
    --stamp-known-bg: #2B2213;
    --stamp-default: #AEB8C2;
    --stamp-default-bg: #1C232B;
    --amber: #E0A24E;
    --green: #6FCB98;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    --shadow-hover: 0 2px 6px rgba(0,0,0,0.35), 0 14px 32px rgba(0,0,0,0.4);
    --shadow-open: 0 3px 10px rgba(0,0,0,0.4), 0 20px 40px rgba(0,0,0,0.45);
    color-scheme: dark;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  html{ scroll-behavior: smooth; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .mono{ font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; }
  a{ color: var(--stamp-updated); }

  /* ---------- Header ---------- */
  .topbar{
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--hairline);
  }
  .topbar-inner{ max-width: 740px; margin: 0 auto; padding: 22px 20px 16px; }
  .brand{ display:flex; align-items:baseline; justify-content: space-between; gap: 12px; }
  .brand-left{ display:flex; align-items:baseline; gap: 10px; }
  .brand h1{
    font-family: "IBM Plex Mono", monospace;
    font-weight: 700; font-size: 20px; letter-spacing: -0.01em; margin: 0;
  }
  .brand .caret{ color: var(--amber); }
  .brand-sub{ font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-soft); }
  .header-actions{ display:flex; align-items:center; gap: 8px; flex-shrink: 0; }
  .icon-btn{
    border: 1px solid var(--hairline); background: var(--paper-raised); color: var(--ink-soft);
    height: 34px; border-radius: 8px; display:flex; align-items:center; justify-content:center;
    cursor: pointer; flex-shrink: 0;
    transition: border-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .icon-btn:hover{ border-color: #97A3AF; color: var(--ink); box-shadow: var(--shadow); }
  .icon-btn svg{ width:16px; height:16px; flex-shrink:0; }
  .icon-btn.square{ width: 34px; }
  .report-btn{
    gap: 6px; padding: 0 12px; font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px; font-weight: 600; text-decoration: none; opacity: 0.85;
  }
  .report-btn:hover{ opacity: 1; color: var(--stamp-removed); border-color: color-mix(in srgb, var(--stamp-removed) 45%, var(--hairline)); }
  .theme-toggle .sun{ display:none; }
  html[data-theme="dark"] .theme-toggle .moon{ display:none; }
  html[data-theme="dark"] .theme-toggle .sun{ display:block; }

  /* ---------- Search ---------- */
  .search-wrap{ margin-top: 18px; }
  .search-box{
    display:flex; align-items:center; gap: 8px;
    border: 1px solid var(--hairline); background: var(--paper-raised);
    border-radius: 8px; padding: 9px 12px; box-shadow: var(--shadow);
    transition: border-color .15s ease;
  }
  .search-box:focus-within{ border-color: var(--stamp-updated); }
  .search-box svg{ width:15px; height:15px; color: var(--ink-soft); flex-shrink:0; }
  .search-box input{
    border:0; outline:0; background:transparent; color: var(--ink);
    font-family: "IBM Plex Mono", monospace; font-size: 13.5px; width: 100%;
  }
  .search-box input::placeholder{ color: var(--ink-soft); }
  .search-meta{ font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-soft); margin-top: 8px; padding-left: 2px; }

  /* ---------- Release list ---------- */
  main{ max-width: 740px; margin: 0 auto; padding: 30px 20px 90px; }

  .status-card{
    display:flex; align-items:flex-start; gap: 12px;
    background: var(--paper-raised); border: 1px solid var(--hairline); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 4px;
  }
  .status-icon{
    flex-shrink:0; width: 32px; height:32px; border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
  }
  .status-icon svg{ width:17px; height:17px; }
  .status-title{ font-weight: 600; font-size: 14px; color: var(--ink); }
  .status-desc{ font-size: 13px; color: var(--ink-soft); margin-top: 3px; line-height: 1.5; }
  .status-loading .status-icon{ background: var(--stamp-default-bg); color: var(--stamp-default); }
  .status-empty .status-icon{ background: var(--stamp-updated-bg); color: var(--stamp-updated); }
  .status-malformed .status-icon{ background: var(--stamp-known-bg); color: var(--stamp-known); }
  .status-hidden .status-icon{ background: var(--stamp-known-bg); color: var(--stamp-known); }
  .status-error .status-icon{ background: var(--stamp-removed-bg); color: var(--stamp-removed); }
  .status-error .status-title{ color: var(--stamp-removed); }

  .pulse-dot{
    width: 8px; height: 8px; border-radius: 50%; background: var(--stamp-default);
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity: 0.35; transform: scale(0.85); } 50%{ opacity: 1; transform: scale(1); } }

  .list{ position: relative; display: flex; flex-direction: column; gap: 12px; }
  .list::before{
    content: "";
    position: absolute; left: 21px; top: 8px; bottom: 8px;
    width: 1px; background: var(--spine);
    z-index: 0;
  }

  .entry{ position: relative; padding-left: 54px; }

  .rail-node{
    position:absolute; left: 15px; top: 26px;
    width: 13px; height:13px; border-radius:50%;
    background: var(--paper); border: 2px solid var(--spine);
    z-index: 2;
  }
  .entry.is-latest .rail-node{
    border-color: var(--amber); background: var(--amber);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 20%, transparent);
  }

  .card{
    background: var(--paper-raised);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow .2s ease, border-color .2s ease, background .2s ease;
  }
  .card:hover{ box-shadow: var(--shadow-hover); }
  .entry.expanded .card{ background: var(--paper-open); box-shadow: var(--shadow-open); }
  .entry.is-latest .card{ border-color: color-mix(in srgb, var(--amber) 55%, var(--hairline)); }
  .entry.is-test .card{ border-style: dashed; border-color: color-mix(in srgb, var(--stamp-known) 55%, var(--hairline)); }

  .card-head{ display:flex; align-items: center; gap: 12px; padding: 15px 16px; cursor: pointer; user-select: none; }
  .stamp{
    font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 14px;
    color: var(--ink); background: var(--paper); border: 1px solid var(--hairline);
    border-radius: 6px; padding: 5px 9px; white-space: nowrap; flex-shrink: 0;
  }
  .entry.is-latest .stamp{ color: var(--amber); border-color: color-mix(in srgb, var(--amber) 50%, var(--hairline)); }
  .head-meta{ flex: 1; min-width: 0; }
  .head-title{ font-size: 14px; font-weight: 650; color: var(--ink); white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
  .head-date{
    font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 500;
    color: var(--ink-soft); white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
  }
  .head-summary{ font-size: 13px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
  .badge{
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
    border-radius: 999px; padding: 3px 8px; flex-shrink: 0; white-space: nowrap;
  }
  .badge-latest{ color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 55%, transparent); }
  .badge-test{ color: var(--stamp-known); border: 1px solid color-mix(in srgb, var(--stamp-known) 55%, transparent); }
  .badge-new{ color: var(--green); border: 1px solid color-mix(in srgb, var(--green) 55%, transparent); }
  .chevron{ width: 16px; height:16px; color: var(--ink-soft); flex-shrink:0; transition: transform 0.2s ease; }
  .entry.expanded .chevron{ transform: rotate(180deg); }

  .card-body{ max-height: 0; overflow: hidden; transition: max-height 0.28s ease; }
  .card-body-inner{ padding: 2px 16px 16px 16px; border-top: 1px solid var(--hairline); padding-top: 12px; }

  .note-row{ display:flex; align-items: flex-start; gap: 9px; padding: 6px 0; font-size: 14px; line-height: 1.45; }
  .note-icon{
    flex-shrink: 0; margin-top: 1px; width: 20px; height: 20px; border-radius: 5px;
    display:flex; align-items:center; justify-content:center;
    font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 700;
  }
  .note-text{ flex: 1; }
  .note-link{ display: block; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; margin-top: 2px; word-break: break-all; }
  .note-plain .note-icon{ background: var(--stamp-default-bg); color: var(--stamp-default); }

  mark{ background: color-mix(in srgb, var(--amber) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

  .empty-search{ font-family: "IBM Plex Mono", monospace; color: var(--ink-soft); font-size: 13px; text-align: center; padding: 40px 10px; }

  /* ---------- Back to top ---------- */
  .back-to-top{
    position: fixed; right: 22px; bottom: 22px; z-index: 30;
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--paper-raised); border: 1px solid var(--hairline); color: var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor: pointer;
    box-shadow: var(--shadow-hover);
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .2s ease, transform .2s ease, border-color .15s ease, color .15s ease;
  }
  .back-to-top.visible{ opacity: 1; transform: none; pointer-events: auto; }
  .back-to-top:hover{ border-color: #97A3AF; color: var(--ink); }
  .back-to-top svg{ width: 18px; height: 18px; }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    .card, .icon-btn, .back-to-top{ transition: none; }
    .pulse-dot{ animation: none; opacity: 0.8; }
  }

  @media (max-width: 480px){
    .topbar-inner{ padding: 18px 14px 14px; }
    main{ padding: 24px 14px 70px; }
    .brand h1{ font-size: 17px; }
    .report-btn span{ display:none; }
    .report-btn{ width: 34px; padding: 0; }
    .entry{ padding-left: 44px; }
    .rail-node{ left: 11px; }
    .list::before{ left: 17px; }
    .stamp{ font-size: 12.5px; padding: 4px 7px; }
    .head-summary{ display: none; }
    .back-to-top{ right: 16px; bottom: 16px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-left"><h1>release<span class="caret">_</span>log</h1></div>
      <div class="header-actions">
        <a class="icon-btn report-btn" href="https://techduck.com/codered" target="_blank" rel="noopener noreferrer" title="Report a bug or issue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="7" width="8" height="11" rx="4"/><path d="M8 9 4 7M16 9l4-2M8 16l-4 2M16 16l4 2M12 7V4M9 4h6M4 12h4M16 12h4"/></svg>
          <span>Report issue</span>
        </a>
        <button class="icon-btn square theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="brand-sub" id="releaseCount">reading CHANGELOG.txt…</div>
    <div class="search-wrap">
      <div class="search-box" id="searchBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="search versions, dates, notes…" autocomplete="off" spellcheck="false">
      </div>
      <div class="search-meta" id="searchMeta"></div>
    </div>
  </div>
</div>

<main>
  <div id="statusWrap"></div>
  <div class="list" id="list" style="display:none;"></div>
  <div class="empty-search" id="emptySearch" style="display:none;">No releases match that search.</div>
</main>

<button class="back-to-top" id="backToTop" aria-label="Back to top" title="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
(function(){
  "use strict";

  var CATEGORY_MAP = {
    "added":       { label: "Added",       glyph: "+", color: "--stamp-added",      bg: "--stamp-added-bg" },
    "updated":     { label: "Updated",     glyph: "~", color: "--stamp-updated",     bg: "--stamp-updated-bg" },
    "fixed":       { label: "Fixed",       glyph: "\u2713", color: "--stamp-fixed",  bg: "--stamp-fixed-bg" },
    "changed":     { label: "Changed",     glyph: "\u0394", color: "--stamp-changed",bg: "--stamp-changed-bg" },
    "removed":     { label: "Removed",     glyph: "\u2212", color: "--stamp-removed",bg: "--stamp-removed-bg" },
    "security":    { label: "Security",    glyph: "\u26E8", color: "--stamp-security", bg: "--stamp-security-bg" },
    "improved":    { label: "Improved",    glyph: "\u2191", color: "--stamp-improved", bg: "--stamp-improved-bg" },
    "deprecated":  { label: "Deprecated",  glyph: "!",     color: "--stamp-deprecated", bg: "--stamp-deprecated-bg" },
    "known":       { label: "Known Issue", glyph: "?",     color: "--stamp-known",   bg: "--stamp-known-bg" }
  };

  var CHANGELOG_URL = "CHANGELOG.txt";
  var HIDDEN_TEST_VERSION = "0.0.0";
  var LAST_SEEN_STORAGE_KEY = "releaseLogLastSeen";
  var LOG_PREFIX = "[release-log]";
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var allReleases = [];
  var openKey = null;
  var openKeyInitialized = false;
  var showTestRelease = false;
  var newKeys = {};          // keys of releases added since the visitor's last visit
  var pendingScrollKey = null; // set on deep-link load, scrolled to once rendered

  // ---------- Theme ----------
  function initTheme(){
    var saved = null;
    try { saved = localStorage.getItem("releaseLogTheme"); } catch(e) {}
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  }
  function toggleTheme(){
    var current = document.documentElement.getAttribute("data-theme");
    var next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("releaseLogTheme", next); } catch(e) {}
  }
  initTheme();
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);

  // ---------- Parser ----------
  function parseChangelog(raw){
    var lines = raw.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
    var releases = [];
    var current = null;
    var malformedBlocks = 0;

    function pushCurrent(){
      if (current) {
        if (!current.version) {
          malformedBlocks++;
          console.warn(LOG_PREFIX, "skipped a release block with no 'Version:' line", current);
        } else {
          if (!current.date) current.date = "Unknown Date";
          releases.push(current);
        }
      }
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line === "") continue;

      var versionMatch = line.match(/^version:\s*(.*)$/i);
      if (versionMatch) {
        pushCurrent();
        current = { version: versionMatch[1].trim(), date: "", subject: "", notes: [] };
        continue;
      }
      if (!current) continue;

      var dateMatch = line.match(/^date:\s*(.*)$/i);
      if (dateMatch) { current.date = dateMatch[1].trim(); continue; }

      var subjectMatch = line.match(/^(?:subject|name):\s*(.*)$/i);
      if (subjectMatch) { current.subject = subjectMatch[1].trim(); continue; }

      current.notes.push(line);
    }
    pushCurrent();

    console.log(LOG_PREFIX, "parsed " + releases.length + " release(s)" + (malformedBlocks ? ", skipped " + malformedBlocks + " malformed block(s)" : ""));
    return { releases: releases, malformedBlocks: malformedBlocks };
  }

  function parseNoteLine(line){
    var linkMatch = line.match(/\{([^}]*)\}/);
    var link = null;
    var text = line;
    if (linkMatch) {
      link = linkMatch[1].trim();
      text = (line.slice(0, linkMatch.index) + line.slice(linkMatch.index + linkMatch[0].length)).trim();
    }
    var firstWordMatch = text.match(/^([A-Za-z]+)\b/);
    var category = null;
    if (firstWordMatch) {
      var key = firstWordMatch[1].toLowerCase();
      if (CATEGORY_MAP[key]) category = CATEGORY_MAP[key];
    }
    return { text: text, link: link, category: category };
  }

  // ---------- Sorting ----------
  function versionParts(v){
    return String(v).split(".").map(function(n){ var p = parseInt(n, 10); return isNaN(p) ? 0 : p; });
  }
  function compareReleases(a, b){
    var pa = versionParts(a.version), pb = versionParts(b.version);
    var len = Math.max(pa.length, pb.length);
    for (var i = 0; i < len; i++) {
      var va = pa[i] || 0, vb = pb[i] || 0;
      if (va !== vb) return vb - va;
    }
    var da = Date.parse(a.date), db = Date.parse(b.date);
    if (!isNaN(da) && !isNaN(db) && da !== db) return db - da;
    return 0;
  }

  function keyOf(release){ return release.version + "@" + release.date; }

  function slugifyPart(s){
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-+|-+$)/g, "");
  }
  function slugFor(release){
    return slugifyPart("v" + release.version) + "-" + slugifyPart(release.date);
  }

  function visibleReleases(){
    return allReleases.filter(function(r){ return showTestRelease || r.version !== HIDDEN_TEST_VERSION; });
  }
  function toDisplayOrder(list){
    var test = list.filter(function(r){ return r.version === HIDDEN_TEST_VERSION; });
    var rest = list.filter(function(r){ return r.version !== HIDDEN_TEST_VERSION; });
    return test.concat(rest);
  }

  // ---------- "New since last visit" ----------
  function computeNewSinceLastVisit(realOnlySorted){
    var lastSeenKey = null;
    try { lastSeenKey = localStorage.getItem(LAST_SEEN_STORAGE_KEY); } catch(e) {}

    var marks = {};
    if (lastSeenKey) {
      var idx = -1;
      for (var i = 0; i < realOnlySorted.length; i++) {
        if (keyOf(realOnlySorted[i]) === lastSeenKey) { idx = i; break; }
      }
      if (idx > 0) {
        for (var j = 0; j < idx; j++) marks[keyOf(realOnlySorted[j])] = true;
      }
    }
    try {
      if (realOnlySorted.length) localStorage.setItem(LAST_SEEN_STORAGE_KEY, keyOf(realOnlySorted[0]));
    } catch(e) {}
    return marks;
  }

  // ---------- Status / error states ----------
  var ICONS = {
    loading: '<div class="pulse-dot"></div>',
    empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7M12 12v6M9 15h6"/></svg>',
    malformed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
    hidden: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a17.4 17.4 0 0 1-2.16 3.19M6.6 6.6C3.9 8.3 2 12 2 12s3 8 10 8a9.3 9.3 0 0 0 5.4-1.6M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>'
  };
  function renderStatus(kind, title, desc){
    var wrap = document.getElementById("statusWrap");
    if (!kind) { wrap.innerHTML = ""; wrap.style.display = "none"; return; }
    wrap.style.display = "block";
    wrap.innerHTML =
      '<div class="status-card status-' + kind + '">' +
        '<div class="status-icon">' + (ICONS[kind] || "") + '</div>' +
        '<div>' +
          '<div class="status-title">' + escapeHtml(title) + '</div>' +
          (desc ? '<div class="status-desc">' + escapeHtml(desc) + '</div>' : '') +
        '</div>' +
      '</div>';
  }

  // ---------- Rendering ----------
  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function highlight(text, query){
    if (!text) return "";
    if (!query) return escapeHtml(text);
    var escaped = escapeHtml(text);
    var escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    var re = new RegExp("(" + escapedQuery + ")", "ig");
    return escaped.replace(re, "<mark>$1</mark>");
  }
  function summarize(notes){
    if (!notes.length) return "";
    var parsed = parseNoteLine(notes[0]);
    var extra = notes.length - 1;
    return parsed.text + (extra > 0 ? "  \u00b7  +" + extra + " more" : "");
  }

  function setHashForKey(key, release){
    var target = key === null ? (location.pathname + location.search) : ("#" + slugFor(release));
    try { history.replaceState(null, "", target); } catch(e) {}
  }

  function renderReleases(displayList, query, latestRealKey){
    var list = document.getElementById("list");
    var emptySearch = document.getElementById("emptySearch");
    list.innerHTML = "";

    if (!displayList.length) {
      list.style.display = "none";
      emptySearch.style.display = "block";
      return;
    }
    list.style.display = "flex";
    emptySearch.style.display = "none";

    var refs = [];

    displayList.forEach(function(release, idx){
      var key = keyOf(release);
      var isLatest = key === latestRealKey;
      var isTest = release.version === HIDDEN_TEST_VERSION;
      var isNew = !isTest && !isLatest && !!newKeys[key];
      var isOpen = key === openKey;

      var entry = document.createElement("div");
      entry.className = "entry" + (isLatest ? " is-latest" : "") + (isTest ? " is-test" : "") + (isOpen ? " expanded" : "");
      entry.dataset.rkey = key;

      var node = document.createElement("div");
      node.className = "rail-node";
      entry.appendChild(node);

      var card = document.createElement("div");
      card.className = "card";

      var head = document.createElement("div");
      head.className = "card-head";
      var titleHtml = release.subject ? '<div class="head-title">' + highlight(release.subject, query) + '</div>' : "";
      var badgeHtml = isTest ? '<span class="badge badge-test">TEST</span>'
        : isLatest ? '<span class="badge badge-latest">LATEST</span>'
        : isNew ? '<span class="badge badge-new">NEW</span>'
        : "";
      head.innerHTML =
        '<div class="stamp mono">v' + escapeHtml(release.version) + '</div>' +
        '<div class="head-meta">' +
          titleHtml +
          '<div class="head-date">' + highlight(release.date, query) + '</div>' +
          '<div class="head-summary">' + highlight(summarize(release.notes), query) + '</div>' +
        '</div>' +
        badgeHtml +
        '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

      var body = document.createElement("div");
      body.className = "card-body";
      var bodyInner = document.createElement("div");
      bodyInner.className = "card-body-inner";

      release.notes.forEach(function(noteLine){
        var parsed = parseNoteLine(noteLine);
        var row = document.createElement("div");
        row.className = "note-row" + (parsed.category ? "" : " note-plain");
        var iconStyle = "";
        var iconLabel = "\u2022";
        if (parsed.category) {
          iconStyle = 'style="color:var(' + parsed.category.color + ');background:var(' + parsed.category.bg + ');"';
          iconLabel = parsed.category.glyph;
        }
        var linkHtml = "";
        if (parsed.link) {
          var safeLink = escapeHtml(parsed.link);
          linkHtml = '<a class="note-link mono" href="' + safeLink + '" target="_blank" rel="noopener noreferrer">' + highlight(parsed.link, query) + '</a>';
        }
        row.innerHTML =
          '<div class="note-icon" ' + iconStyle + '>' + iconLabel + '</div>' +
          '<div class="note-text">' + highlight(parsed.text, query) + linkHtml + '</div>';
        bodyInner.appendChild(row);
      });

      body.appendChild(bodyInner);
      card.appendChild(head);
      card.appendChild(body);
      entry.appendChild(card);
      list.appendChild(entry);

      if (isOpen) {
        requestAnimationFrame(function(){ body.style.maxHeight = bodyInner.scrollHeight + 40 + "px"; });
      }

      refs.push({ key: key, release: release, entry: entry, head: head, body: body, bodyInner: bodyInner });
    });

    refs.forEach(function(ref){
      ref.head.addEventListener("click", function(){
        var willOpen = ref.key !== openKey;
        refs.forEach(function(r){
          var shouldOpen = willOpen && r.key === ref.key;
          r.entry.classList.toggle("expanded", shouldOpen);
          r.body.style.maxHeight = shouldOpen ? (r.bodyInner.scrollHeight + 40) + "px" : "0px";
        });
        openKey = willOpen ? ref.key : null;
        setHashForKey(openKey, willOpen ? ref.release : null);
        if (willOpen) {
          setTimeout(function(){
            ref.entry.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
          }, 60);
        }
      });
    });

    if (pendingScrollKey) {
      var target = refs.find(function(r){ return r.key === pendingScrollKey; });
      if (target) {
        var doScroll = function(){ target.entry.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" }); };
        setTimeout(doScroll, 80);
      }
      pendingScrollKey = null;
    }
  }

  // ---------- Search ----------
  function matchesQuery(release, query){
    if (!query) return true;
    var haystack = (release.version + " " + release.date + " " + (release.subject || "") + " " + release.notes.join(" ")).toLowerCase();
    return haystack.indexOf(query.toLowerCase()) !== -1;
  }

  function applySearch(){
    var query = document.getElementById("searchInput").value.trim();
    var base = visibleReleases();
    var realOnly = base.filter(function(r){ return r.version !== HIDDEN_TEST_VERSION; });
    var latestRealKey = realOnly.length ? keyOf(realOnly[0]) : null;

    if (!openKeyInitialized) {
      openKey = latestRealKey;
      openKeyInitialized = true;
    }

    var filtered = base.filter(function(r){ return matchesQuery(r, query); });
    var display = toDisplayOrder(filtered);
    renderReleases(display, query, latestRealKey);

    var meta = document.getElementById("searchMeta");
    meta.textContent = query
      ? filtered.length + " of " + base.length + " release" + (base.length === 1 ? "" : "s") + " match"
      : "";
  }

  document.getElementById("searchInput").addEventListener("input", applySearch);

  document.addEventListener("keydown", function(e){
    if (e.ctrlKey && e.altKey && e.shiftKey && (e.key === "D" || e.key === "d")) {
      showTestRelease = !showTestRelease;
      console.log(LOG_PREFIX, "test release visibility:", showTestRelease);
      applySearch();
    }
  });

  // ---------- Back to top ----------
  var backToTop = document.getElementById("backToTop");
  var backToTopRaf = null;
  function updateBackToTop(){ backToTop.classList.toggle("visible", window.scrollY > 420); }
  window.addEventListener("scroll", function(){
    if (backToTopRaf) return;
    backToTopRaf = requestAnimationFrame(function(){ backToTopRaf = null; updateBackToTop(); });
  }, { passive: true });
  backToTop.addEventListener("click", function(){ window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); });
  updateBackToTop();

  // ---------- Load ----------
  renderStatus("loading", "Loading release notes\u2026", "Fetching CHANGELOG.txt");

  fetch(CHANGELOG_URL, { cache: "no-store" })
    .then(function(res){
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(function(raw){
      if (raw.trim() === "") {
        console.log(LOG_PREFIX, "CHANGELOG.txt loaded but is empty");
        renderStatus("empty", "CHANGELOG.txt is empty", "Add a release block to get started \u2014 see the README for the format.");
        document.getElementById("releaseCount").textContent = "0 releases";
        return;
      }

      var parsed = parseChangelog(raw);
      allReleases = parsed.releases.sort(compareReleases);

      if (!allReleases.length) {
        renderStatus("malformed", "Couldn't find any releases", "Make sure each entry in CHANGELOG.txt starts with a 'Version:' line.");
        document.getElementById("releaseCount").textContent = "0 releases";
        return;
      }

      // Deep link: #v6-0-17-aug-10-2026 opens (and, if needed, reveals) that release.
      var hashSlug = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";
      if (hashSlug) {
        var matched = allReleases.find(function(r){ return slugFor(r) === hashSlug; });
        if (matched) {
          if (matched.version === HIDDEN_TEST_VERSION) showTestRelease = true;
          openKey = keyOf(matched);
          openKeyInitialized = true;
          pendingScrollKey = openKey;
        }
      }

      var realOnly = allReleases.filter(function(r){ return r.version !== HIDDEN_TEST_VERSION; });
      newKeys = computeNewSinceLastVisit(realOnly);

      var visible = visibleReleases();
      if (!visible.length) {
        renderStatus("hidden", "Every release here is hidden", "All entries are marked as the internal 0.0.0 test version. Press Ctrl+Alt+Shift+D to view them.");
        document.getElementById("releaseCount").textContent = "0 visible releases";
        return;
      }

      renderStatus(null);
      var latestLabel = realOnly.length ? realOnly[0].version : visible[0].version;
      document.getElementById("releaseCount").textContent =
        visible.length + " release" + (visible.length === 1 ? "" : "s") + "  \u00b7  latest v" + latestLabel;
      applySearch();
    })
    .catch(function(err){
      console.error(LOG_PREFIX, "failed to load CHANGELOG.txt:", err);
      renderStatus("error", "Unable to load release notes", "CHANGELOG.txt could not be reached. ");
      document.getElementById("releaseCount").textContent = "";
    });
})();
</script>
